# ~/.config/tmux/tmux.conf (linked from the dotfiles repo by install.sh)

# --- Prefix: Ctrl+a instead of Ctrl+b ---------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix            # Ctrl+a Ctrl+a sends a literal Ctrl+a to the program

# --- General ------------------------------------------------------------------
set -g mouse on
set -g base-index 1             # windows start at 1 (easier to reach than 0)
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
# macOS's system terminfo has no tmux-256color entry.
if 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal tmux-256color' \
    'set -g default-terminal screen-256color'
set -as terminal-features ',*:RGB'

# --- Key bindings -------------------------------------------------------------
# d = detach, n = next window, p = previous window are tmux defaults.
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"    # left | right
bind _ split-window -v -c "#{pane_current_path}"    # top / bottom
bind x confirm-before -p "kill window #W? (y/n)" kill-window
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# --- Survive reboots ----------------------------------------------------------
# tmux-resurrect saves/restores sessions, windows, panes and working dirs.
# tmux-continuum auto-saves every 5 minutes. Restoring after a reboot is done
# by `tm` (bin/tm) the first time it starts the tmux server, so continuum's own
# auto-restore is left off.
set -g @resurrect-dir '~/.local/share/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'off'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Fetch the plugins on first start if install.sh hasn't already.
if 'test ! -d ~/.config/tmux/plugins/tpm' \
    "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Keep this line at the very bottom.
run '~/.config/tmux/plugins/tpm/tpm'
